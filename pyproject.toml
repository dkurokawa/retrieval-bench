[project]
name = "retrieval-bench"
version = "0.1.0"
description = "Compare BM25, dense, and hybrid retrieval on public IR benchmarks under matched conditions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Dai Kurokawa" }]
dependencies = ["numpy>=1.26", "scipy>=1.11", "duckdb>=0.10"]

[project.optional-dependencies]
dense = ["sentence-transformers>=2.7"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "scipy-stubs>=1.17.1.5",
]

[project.scripts]
rbench = "retrieval_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retrieval_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# Optional heavy dependency (installed only via the `dense` extra); the CI
# lint job runs without it, so its absence must not fail the strict check.
module = "sentence_transformers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["retrieval_bench"]
